[project]
name = "rgi-utils"
version = "0.1.0"
description = "Restraint-Guided Inference utilities for PyTorch-based structure prediction models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "rdkit>=2024.3.2",
]

[project.optional-dependencies]
# PyTorch backend (boltz, protenix). Uses torch.optim.LBFGS — no extra optimizer dep.
torch = [
    "torch>=2.2",
]
# JAX backend (alphafold3). Uses jaxopt LBFGS/NonlinearCG (jittable, in-JIT).
jax = [
    "jax",
    "jaxlib",
    "jaxopt",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Install CPU-only torch to keep CI image small and fast
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.pycodestyle]
# Keep the FORMATTER at line-length 88 (code stays wrapped) but let E501 tolerate the
# codebase's dense long-form COMMENT style up to 120, rather than rewrapping ~160 prose
# lines or scattering noqa. Code line length is enforced by the formatter, not E501.
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU (deselect with '-m \"not gpu\"')",
]
