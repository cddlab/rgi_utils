version: "3"

tasks:
  lint:
    desc: Run ruff linter and formatter check
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:
    desc: Run ruff formatter
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  test:
    desc: Run pytest
    cmds:
      - uv run pytest
