[project]
name = "rgi-utils"
version = "0.1.0"
description = "Restraint-Guided Inference utilities for PyTorch-based structure prediction models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "rdkit>=2024.3.2",
    "scipy",
    "pytorch-minimize @ git+https://github.com/ishitani/pytorch-minimize.git@nobackprop",
    "torch>=2.2",
    "torch_cluster",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Pre-built CPU wheels for torch-cluster (must match torch version above)
find-links = ["https://data.pyg.org/whl/torch-2.6.0+cpu.html"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Install CPU-only torch to keep CI image small and fast
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU (deselect with '-m \"not gpu\"')",
]
