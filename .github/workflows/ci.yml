name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true       # cache ~/.cache/uv keyed on uv.lock
      - name: Install dependencies
        # `--extra torch` pulls the CPU-only wheel (see the pytorch-cpu index in
        # pyproject.toml): the torch backend is the primary one (boltz / protenix /
        # chai / esmfold2). Install JAX too so AF3 and backend parity tests run.
        run: uv sync --frozen --extra torch --extra jax
      - name: Test
        run: uv run pytest -m "not gpu"
