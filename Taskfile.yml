version: "3"

tasks:
  lint:
    desc: Run ruff linter and formatter check
    cmds:
      - uv run --no-sync ruff check .
      - uv run --no-sync ruff format --check .

  format:
    desc: Run ruff formatter
    cmds:
      - uv run --no-sync ruff format .
      - uv run --no-sync ruff check --fix .

  test:
    desc: Run pytest using /venv Python (preserves existing torch ecosystem)
    cmds:
      - PYTHONPATH=src /venv/bin/python3 -m pytest
